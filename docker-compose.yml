version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: assert-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-asset_platform}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./assert_PLATFORM/server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:22-alpine
    container_name: assert-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./assert_PLATFORM:/app
      - ./assert_PLATFORM/releases:/app/releases
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-asset_platform}
      API_PORT: 3000
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
      RELEASES_ROOT: ${RELEASES_ROOT:-/app/releases}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      HK_IPO_SOURCE_FILE: ${HK_IPO_SOURCE_FILE:-}
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c 'npm install && node server/server.js'

  web:
    image: nginx:alpine
    container_name: assert-web
    restart: unless-stopped
    volumes:
      - ./assert_WEB:/usr/share/nginx/html:ro
    ports:
      - '4173:80'
    depends_on:
      - api

volumes:
  mysql-data:
