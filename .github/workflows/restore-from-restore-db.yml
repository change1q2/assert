name: Restore Data from Restore DB

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore data from asset_platform_restore via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          command_timeout: 30m
          script: |
            echo "========================================"
            echo "  从 asset_platform_restore 恢复数据"
            echo "========================================"

            # ---------- 1. 查找 Docker MySQL 容器 ----------
            echo ""
            echo "=== 1. 查找 Docker MySQL 容器 ==="
            CONTAINER_ID=$(docker ps 2>/dev/null | grep -i mysql | awk '{print $1}' | head -1)
            if [ -z "$CONTAINER_ID" ]; then
              echo "ERROR: 未找到 MySQL 容器"
              exit 1
            fi
            echo "MySQL 容器: $CONTAINER_ID"

            # 获取密码
            MYSQL_ROOT_PASSWORD=$(docker exec "$CONTAINER_ID" env 2>/dev/null | grep -i "MYSQL_ROOT_PASSWORD" | cut -d= -f2)
            [ -z "$MYSQL_ROOT_PASSWORD" ] && MYSQL_ROOT_PASSWORD=$(docker exec "$CONTAINER_ID" env 2>/dev/null | grep -i "MYSQL_PASSWORD" | cut -d= -f2)
            [ -z "$MYSQL_ROOT_PASSWORD" ] && MYSQL_ROOT_PASSWORD="123456"
            echo "使用密码: ${MYSQL_ROOT_PASSWORD:-(默认)}"

            MYSQL_CMD="docker exec $CONTAINER_ID mysql -u root -p$MYSQL_ROOT_PASSWORD"

            # ---------- 2. 检查 restore 库中的用户和数据 ----------
            echo ""
            echo "=== 2. asset_platform_restore 用户数据 ==="
            $MYSQL_CMD asset_platform_restore -e "
              SELECT u.id, u.account, p.name,
                (SELECT COUNT(*) FROM accounts WHERE user_id=u.id) as accounts,
                (SELECT COUNT(*) FROM records WHERE user_id=u.id) as records,
                (SELECT COUNT(*) FROM finance_assets WHERE user_id=u.id) as finance_assets,
                (SELECT COUNT(*) FROM debts WHERE user_id=u.id) as debts,
                (SELECT COUNT(*) FROM asset_classes WHERE user_id=u.id) as asset_classes,
                (SELECT COUNT(*) FROM books WHERE user_id=u.id) as books
              FROM users u
              LEFT JOIN user_profiles p ON p.user_id=u.id
              ORDER BY u.id;
            " 2>&1

            # ---------- 3. 当前库的数据对比 ----------
            echo ""
            echo "=== 3. asset_platform（当前）用户数据 ==="
            $MYSQL_CMD asset_platform -e "
              SELECT u.id, u.account, p.name,
                (SELECT COUNT(*) FROM accounts WHERE user_id=u.id) as accounts,
                (SELECT COUNT(*) FROM records WHERE user_id=u.id) as records,
                (SELECT COUNT(*) FROM finance_assets WHERE user_id=u.id) as finance_assets,
                (SELECT COUNT(*) FROM debts WHERE user_id=u.id) as debts,
                (SELECT COUNT(*) FROM asset_classes WHERE user_id=u.id) as asset_classes,
                (SELECT COUNT(*) FROM books WHERE user_id=u.id) as books
              FROM users u
              LEFT JOIN user_profiles p ON p.user_id=u.id
              ORDER BY u.id;
            " 2>&1

            # ---------- 4. 逐用户对比并恢复数据 ----------
            echo ""
            echo "=== 4. 对比并恢复数据 ==="

            # 获取 restore 库中所有用户 ID
            RESTORE_USERS=$($MYSQL_CMD asset_platform_restore -e "SELECT id FROM users ORDER BY id;" 2>/dev/null | grep -v id)

            for userId in $RESTORE_USERS; do
              echo ""
              echo "--- 用户 $userId ---"

              # 检查 restore 库中该用户的各表数据量
              restore_accounts=$($MYSQL_CMD asset_platform_restore -e "SELECT COUNT(*) FROM accounts WHERE user_id=$userId;" 2>/dev/null | tail -1)
              restore_finance=$($MYSQL_CMD asset_platform_restore -e "SELECT COUNT(*) FROM finance_assets WHERE user_id=$userId;" 2>/dev/null | tail -1)
              restore_debts=$($MYSQL_CMD asset_platform_restore -e "SELECT COUNT(*) FROM debts WHERE user_id=$userId;" 2>/dev/null | tail -1)
              restore_records=$($MYSQL_CMD asset_platform_restore -e "SELECT COUNT(*) FROM records WHERE user_id=$userId;" 2>/dev/null | tail -1)

              # 检查当前库中该用户的各表数据量
              current_accounts=$($MYSQL_CMD asset_platform -e "SELECT COUNT(*) FROM accounts WHERE user_id=$userId;" 2>/dev/null | tail -1)
              current_finance=$($MYSQL_CMD asset_platform -e "SELECT COUNT(*) FROM finance_assets WHERE user_id=$userId;" 2>/dev/null | tail -1)
              current_debts=$($MYSQL_CMD asset_platform -e "SELECT COUNT(*) FROM debts WHERE user_id=$userId;" 2>/dev/null | tail -1)
              current_records=$($MYSQL_CMD asset_platform -e "SELECT COUNT(*) FROM records WHERE user_id=$userId;" 2>/dev/null | tail -1)

              echo "  accounts: restore=$restore_accounts current=$current_accounts"
              echo "  finance_assets: restore=$restore_finance current=$current_finance"
              echo "  debts: restore=$restore_debts current=$current_debts"
              echo "  records: restore=$restore_records current=$current_records"

              # 如果 restore 库中有更多数据，则恢复
              if [ "$restore_accounts" -gt "$current_accounts" ] || [ "$restore_finance" -gt "$current_finance" ] || [ "$restore_debts" -gt "$current_debts" ] || [ "$restore_records" -gt "$current_records" ]; then
                echo "  ★ 发现更多数据，开始恢复..."

                # 恢复 accounts
                if [ "$restore_accounts" -gt "$current_accounts" ]; then
                  echo "  恢复 accounts..."
                  $MYSQL_CMD asset_platform -e "DELETE FROM accounts WHERE user_id=$userId;" 2>/dev/null
                  $MYSQL_CMD asset_platform -e "INSERT INTO asset_platform.accounts SELECT * FROM asset_platform_restore.accounts WHERE user_id=$userId;" 2>&1 | head -3
                  new_cnt=$($MYSQL_CMD asset_platform -e "SELECT COUNT(*) FROM accounts WHERE user_id=$userId;" 2>/dev/null | tail -1)
                  echo "    accounts: 恢复后 $new_cnt 行"
                fi

                # 恢复 finance_assets
                if [ "$restore_finance" -gt "$current_finance" ]; then
                  echo "  恢复 finance_assets..."
                  $MYSQL_CMD asset_platform -e "DELETE FROM finance_assets WHERE user_id=$userId;" 2>/dev/null
                  $MYSQL_CMD asset_platform -e "INSERT INTO asset_platform.finance_assets SELECT * FROM asset_platform_restore.finance_assets WHERE user_id=$userId;" 2>&1 | head -3
                  # 恢复关联交易
                  $MYSQL_CMD asset_platform -e "DELETE FROM finance_asset_indoor_transactions WHERE user_id=$userId;" 2>/dev/null
                  $MYSQL_CMD asset_platform -e "INSERT INTO asset_platform.finance_asset_indoor_transactions SELECT * FROM asset_platform_restore.finance_asset_indoor_transactions WHERE user_id=$userId;" 2>&1 | head -3
                  $MYSQL_CMD asset_platform -e "INSERT INTO asset_platform.finance_asset_outdoor_transactions SELECT * FROM asset_platform_restore.finance_asset_outdoor_transactions WHERE user_id=$userId;" 2>&1 | head -3
                  new_cnt=$($MYSQL_CMD asset_platform -e "SELECT COUNT(*) FROM finance_assets WHERE user_id=$userId;" 2>/dev/null | tail -1)
                  echo "    finance_assets: 恢复后 $new_cnt 行"
                fi

                # 恢复 debts
                if [ "$restore_debts" -gt "$current_debts" ]; then
                  echo "  恢复 debts..."
                  $MYSQL_CMD asset_platform -e "DELETE FROM debt_payments WHERE user_id=$userId;" 2>/dev/null
                  $MYSQL_CMD asset_platform -e "DELETE FROM debts WHERE user_id=$userId;" 2>/dev/null
                  $MYSQL_CMD asset_platform -e "INSERT INTO asset_platform.debts SELECT * FROM asset_platform_restore.debts WHERE user_id=$userId;" 2>&1 | head -3
                  new_cnt=$($MYSQL_CMD asset_platform -e "SELECT COUNT(*) FROM debts WHERE user_id=$userId;" 2>/dev/null | tail -1)
                  echo "    debts: 恢复后 $new_cnt 行"
                fi

                # 恢复 records
                if [ "$restore_records" -gt "$current_records" ]; then
                  echo "  恢复 records..."
                  $MYSQL_CMD asset_platform -e "DELETE FROM record_tags WHERE user_id=$userId;" 2>/dev/null
                  $MYSQL_CMD asset_platform -e "DELETE FROM records WHERE user_id=$userId;" 2>/dev/null
                  $MYSQL_CMD asset_platform -e "INSERT INTO asset_platform.records SELECT * FROM asset_platform_restore.records WHERE user_id=$userId;" 2>&1 | head -3
                  new_cnt=$($MYSQL_CMD asset_platform -e "SELECT COUNT(*) FROM records WHERE user_id=$userId;" 2>/dev/null | tail -1)
                  echo "    records: 恢复后 $new_cnt 行"
                fi
              else
                echo "  数据无差异，跳过"
              fi
            done

            # ---------- 5. 恢复公共表 ----------
            echo ""
            echo "=== 5. 恢复公共表数据 ==="

            for table in asset_classes exchange_rates books budgets; do
              restore_cnt=$($MYSQL_CMD asset_platform_restore -e "SELECT COUNT(*) FROM $table;" 2>/dev/null | tail -1)
              current_cnt=$($MYSQL_CMD asset_platform -e "SELECT COUNT(*) FROM $table;" 2>/dev/null | tail -1)
              echo "$table: restore=$restore_cnt current=$current_cnt"
              if [ "$restore_cnt" -gt "$current_cnt" ] && [ "$restore_cnt" -gt "0" ]; then
                echo "  恢复 $table..."
                $MYSQL_CMD asset_platform -e "DELETE FROM $table;" 2>/dev/null
                $MYSQL_CMD asset_platform -e "INSERT INTO asset_platform.$table SELECT * FROM asset_platform_restore.$table;" 2>&1 | head -3
                echo "  $table 已恢复"
              fi
            done

            # ---------- 6. 最终验证 ----------
            echo ""
            echo "=== 6. 恢复后数据验证 ==="
            $MYSQL_CMD asset_platform -e "
              SELECT u.id, u.account,
                (SELECT COUNT(*) FROM accounts WHERE user_id=u.id) as accounts,
                (SELECT COUNT(*) FROM records WHERE user_id=u.id) as records,
                (SELECT COUNT(*) FROM finance_assets WHERE user_id=u.id) as finance_assets,
                (SELECT COUNT(*) FROM debts WHERE user_id=u.id) as debts
              FROM users u
              ORDER BY u.id;
            " 2>&1

            echo ""
            echo "========================================"
            echo "  数据恢复完成"
            echo "========================================"
