name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            export PATH=/usr/local/lighthouse/softwares/nodejs/node/bin:$PATH
            echo "=== node version ==="
            node --version
            which node
            echo "=== fetch availability test ==="
            node -e "console.log('global fetch:', typeof fetch)"
            cd /opt/asset-platform
            echo "=== git info ==="
            git fetch origin main
            BEFORE=$(git rev-parse --short HEAD)
            git reset --hard origin/main
            AFTER=$(git rev-parse --short HEAD)
            echo "BEFORE=$BEFORE AFTER=$AFTER"
            echo "=== install deps ==="
            npm install --omit=dev
            echo "=== restart service ==="
            systemctl restart asset-platform
            sleep 3
            echo "=== health check ==="
            curl -sf http://127.0.0.1/api/health || (echo "HEALTH FAILED"; systemctl status asset-platform --no-pager -l | tail -30; exit 1)
            echo "=== recent service logs (price sync) ==="
            journalctl -u asset-platform --no-pager --since "1 min ago" --output=cat 2>/dev/null | grep -iE "price-sync|MySQL schema initialized|Price sync disabled" || journalctl -u asset-platform --no-pager -n 20 --output=cat 2>/dev/null | tail -20
            echo "=== deploy done ==="
