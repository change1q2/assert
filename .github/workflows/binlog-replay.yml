name: Binlog Replay - Extract Deleted Data

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Extract and replay deleted data from binary logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          command_timeout: 120m
          script: |
            set +e
            echo "========================================"
            echo "  Comprehensive Data Recovery via Binlog"
            echo "  $(date)"
            echo "========================================"

            CONTAINER_ID=$(docker ps | grep -i mysql | awk '{print $1}' | head -1)
            [ -z "$CONTAINER_ID" ] && echo "❌ No MySQL container" && exit 1

            MYSQL_ROOT_PASSWORD=$(docker exec "$CONTAINER_ID" env | grep -i "MYSQL_ROOT_PASSWORD" | cut -d= -f2)
            [ -z "$MYSQL_ROOT_PASSWORD" ] && MYSQL_ROOT_PASSWORD="123456"
            MYSQL="docker exec $CONTAINER_ID mysql -u root -p$MYSQL_ROOT_PASSWORD"

            TS=$(date +%Y%m%d_%H%M%S)
            REC_DIR="/tmp/recovery_$TS"
            mkdir -p "$REC_DIR"

            # ========== STEP 0: Backup ==========
            echo ""
            echo "=== STEP 0: Pre-Recovery Backup ==="
            BACKUP_SQL="$REC_DIR/pre_recovery.sql"
            docker exec "$CONTAINER_ID" mysqldump -u root -p"$MYSQL_ROOT_PASSWORD" \
              --single-transaction --quick asset_platform > "$BACKUP_SQL" 2>/dev/null
            if [ -f "$BACKUP_SQL" ] && [ -s "$BACKUP_SQL" ]; then
              gzip "$BACKUP_SQL"
              echo "✅ Backup: ${BACKUP_SQL}.gz ($(du -h ${BACKUP_SQL}.gz | cut -f1))"
            else
              echo "⚠️ mysqldump failed"
            fi

            # ========== STEP 1: Full Database State ==========
            echo ""
            echo "=== STEP 1: Full Database State ==="
            $MYSQL asset_platform -e "
              SELECT 'accounts' as tbl, COUNT(*) as total,
                SUM(CASE WHEN user_id=1 THEN 1 ELSE 0 END) as u1,
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END) as u3,
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END) as u4
              FROM accounts
              UNION ALL SELECT 'finance_assets', COUNT(*),
                SUM(CASE WHEN user_id=1 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END)
              FROM finance_assets
              UNION ALL SELECT 'records', COUNT(*),
                SUM(CASE WHEN user_id=1 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END)
              FROM records
              UNION ALL SELECT 'debts', COUNT(*), 0,
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END)
              FROM debts
              UNION ALL SELECT 'asset_classes', COUNT(*),
                SUM(CASE WHEN user_id=1 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END)
              FROM asset_classes
              UNION ALL SELECT 'books', COUNT(*),
                SUM(CASE WHEN user_id=1 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END)
              FROM books
              UNION ALL SELECT 'strategies', COUNT(*),
                SUM(CASE WHEN user_id=1 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END)
              FROM strategies;
            " 2>/dev/null

            # ========== STEP 2: Apply Known Backup Files ==========
            echo ""
            echo "=== STEP 2: Apply Known Backup Files ==="

            for BK_SQL in \
              /opt/mysql-backups/asset_platform_full_20260826_151334.sql.gz \
              /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots/401/fs/tmp/backup.sql \
              /opt/shuaiti/server/init-db.sql \
              /root/backup.sql; do
              
              if [ -f "$BK_SQL" ]; then
                BASENAME=$(basename "$BK_SQL")
                echo ""
                echo "--- $BASENAME ---"
                
                if echo "$BK_SQL" | grep -q '.gz'; then
                  gunzip -c "$BK_SQL" > "$REC_DIR/backup.sql"
                  TARGET="$REC_DIR/backup.sql"
                else
                  cp "$BK_SQL" "$REC_DIR/"
                  TARGET="$REC_DIR/$BASENAME"
                fi
                
                CNT=$(grep -c 'INSERT INTO' "$TARGET" 2>/dev/null || echo 0)
                echo "  INSERT statements: $CNT"
                
                if [ "$CNT" -gt 0 ] 2>/dev/null; then
                  echo "  Table breakdown:"
                  for TBL in accounts finance_assets records debts asset_classes; do
                    TBL_CNT=$(grep -c "INSERT INTO.*$TBL" "$TARGET" 2>/dev/null || echo 0)
                    echo "    $TBL: $TBL_CNT"
                  done
                  
                  echo "  Applying with INSERT IGNORE..."
                  sed 's/^INSERT INTO/INSERT IGNORE INTO/g' "$TARGET" > "${TARGET}.apply"
                  $MYSQL asset_platform --force < "${TARGET}.apply" 2>&1 | tail -3
                  echo "  Done"
                fi
              fi
            done

            # ========== STEP 3: Cross-Database Recovery ==========
            echo ""
            echo "=== STEP 3: Cross-Database Recovery ==="
            
            RESTORE_DB="asset_platform_restore"
            if $MYSQL -e "SHOW DATABASES LIKE '$RESTORE_DB';" 2>/dev/null | grep -q "$RESTORE_DB"; then
              echo "✅ $RESTORE_DB exists"
              
              for TABLE in accounts finance_assets records debts asset_classes books strategies; do
                CUR_CNT=$($MYSQL asset_platform -N -B -e "SELECT COUNT(*) FROM $TABLE;" 2>/dev/null)
                RST_CNT=$($MYSQL "$RESTORE_DB" -N -B -e "SELECT COUNT(*) FROM $TABLE;" 2>/dev/null)
                echo ""
                echo "$TABLE: current=$CUR_CNT, restore=$RST_CNT"
                
                if [ "$RST_CNT" -gt "0" ] 2>/dev/null; then
                  echo "  Recovering from restore DB..."
                  RECOVER_SQL="INSERT IGNORE INTO $TABLE SELECT * FROM $RESTORE_DB.$TABLE;"
                  $MYSQL asset_platform -e "$RECOVER_SQL" 2>/dev/null
                  NEW_CNT=$($MYSQL asset_platform -N -B -e "SELECT COUNT(*) FROM $TABLE;" 2>/dev/null)
                  echo "  After recovery: $NEW_CNT"
                fi
              done
            else
              echo "⚠️ $RESTORE_DB not found"
            fi

            # ========== STEP 4: InnoDB .ibd File Recovery ==========
            echo ""
            echo "=== STEP 4: InnoDB .ibd File Recovery ==="
            
            echo "--- .ibd File Sizes ---"
            for TABLE in accounts finance_assets records debts asset_classes; do
              IBD_PATH="/var/lib/mysql/asset_platform/${TABLE}.ibd"
              if docker exec "$CONTAINER_ID" test -f "$IBD_PATH" 2>/dev/null; then
                IBD_SZ=$(docker exec "$CONTAINER_ID" stat -c%s "$IBD_PATH" 2>/dev/null)
                ROW_CNT=$($MYSQL asset_platform -N -B -e "SELECT COUNT(*) FROM $TABLE;" 2>/dev/null)
                echo "  $TABLE.ibd: $IBD_SZ bytes, $ROW_CNT rows"
              fi
            done
            
            echo ""
            echo "--- Copy .ibd Files to Host ---"
            IBD_DIR="$REC_DIR/ibd_files"
            mkdir -p "$IBD_DIR"
            for TABLE in accounts finance_assets records debts asset_classes; do
              IBD_PATH="/var/lib/mysql/asset_platform/${TABLE}.ibd"
              if docker exec "$CONTAINER_ID" test -f "$IBD_PATH" 2>/dev/null; then
                docker cp "$CONTAINER_ID:$IBD_PATH" "$IBD_DIR/" 2>/dev/null
                SZ=$(stat -c%s "$IBD_DIR/${TABLE}.ibd" 2>/dev/null || echo 0)
                echo "  $TABLE.ibd: $SZ bytes copied"
              fi
            done
            
            echo ""
            echo "--- Install Python ---"
            apt-get update -qq 2>/dev/null && apt-get install -y -qq python3 2>/dev/null
            echo "  Python: $(python3 --version 2>&1)"
            
            echo ""
            echo "--- String Pattern Analysis ---"
            for TABLE in accounts finance_assets records debts asset_classes; do
              IBD_FILE="$IBD_DIR/${TABLE}.ibd"
              if [ -f "$IBD_FILE" ]; then
                echo ""
                echo "  $TABLE:"
                STR_FILE="$IBD_DIR/${TABLE}_strings.txt"
                strings "$IBD_FILE" 2>/dev/null > "$STR_FILE"
                CNT=$(wc -l < "$STR_FILE" 2>/dev/null || echo 0)
                echo "    Total strings: $CNT"
                echo "    UUID patterns:"
                grep -E '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$' "$STR_FILE" 2>/dev/null | head -5 | sed 's/^/      /'
                echo "    Short strings (potential names):"
                grep -E '^[A-Za-z][A-Za-z0-9 ]{4,30}$' "$STR_FILE" 2>/dev/null | head -8 | sed 's/^/      /'
              fi
            done
            
            echo ""
            echo "--- InnoDB Python Parser ---"
            PARSER_FILE=$REC_DIR/ibd_parser.py
            curl -sL "https://raw.githubusercontent.com/change1q2/assert/main/assert_PLATFORM/server/scripts/parse_records_ibd.py" -o $PARSER_FILE 2>/dev/null
            if [ -f "$PARSER_FILE" ] && [ -s "$PARSER_FILE" ]; then
              echo "  Downloaded parser: $(wc -l < $PARSER_FILE 2>/dev/null) lines"
            else
              echo "  WARNING: Could not download parser, using strings-only analysis"
            fi
            
            if [ -f "$PARSER_FILE" ] && [ -s "$PARSER_FILE" ]; then
              for TABLE in accounts finance_assets records debts asset_classes; do
                if [ -f "$IBD_DIR/${TABLE}.ibd" ]; then
                  echo "  Parsing $TABLE.ibd..."
                  python3 $PARSER_FILE "$IBD_DIR/${TABLE}.ibd" 2>&1
                fi
              done
              
              echo ""
              echo "--- Extraction Results ---"
              for TABLE in accounts finance_assets records debts asset_classes; do
                EF="/tmp/${TABLE}_extracted.txt"
                if [ -f "$EF" ]; then
                  CNT=$(wc -l < "$EF" 2>/dev/null || echo 0)
                  echo "  $TABLE: $CNT strings"
                  head -3 "$EF" 2>/dev/null | sed 's/^/    /'
                fi
              done
            else
              echo "  Skipping Python parsing (no parser available)"
              echo "  Use strings analysis results above"
            fi

            # ========== Final Verification ==========
            echo ""
            echo "========================================"
            echo "  Final Database State"
            echo "========================================"
            
            $MYSQL asset_platform -e "
              SELECT 'accounts' as tbl, COUNT(*) as total,
                SUM(CASE WHEN user_id=1 THEN 1 ELSE 0 END) as u1,
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END) as u3,
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END) as u4
              FROM accounts
              UNION ALL SELECT 'finance_assets', COUNT(*),
                SUM(CASE WHEN user_id=1 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END)
              FROM finance_assets
              UNION ALL SELECT 'records', COUNT(*),
                SUM(CASE WHEN user_id=1 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END)
              FROM records
              UNION ALL SELECT 'debts', COUNT(*), 0,
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END)
              FROM debts
              UNION ALL SELECT 'asset_classes', COUNT(*),
                SUM(CASE WHEN user_id=1 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END)
              FROM asset_classes
              UNION ALL SELECT 'books', COUNT(*),
                SUM(CASE WHEN user_id=1 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=3 THEN 1 ELSE 0 END),
                SUM(CASE WHEN user_id=4 THEN 1 ELSE 0 END)
              FROM books;
            " 2>/dev/null

            echo ""
            echo "========================================"
            echo "  Recovery Complete"
            echo "  Report: $REC_DIR/"
            echo "========================================"
            ls -lh "$REC_DIR/" 2>/dev/null | head -25
